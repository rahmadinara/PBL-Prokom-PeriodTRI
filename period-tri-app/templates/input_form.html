{% extends "base.html" %}

{% block title %}Input Form - PeriodTRI{% endblock %}

{% block content %}
<div class="input-form-container">
    <!-- Main Heading -->
    <h2 class="form-heading">Before we begin, let us know a bit about you and your condition(s)!</h2>

    <!-- Form Container -->
    <form class="input-form" method="POST" action="{{ url_for('input_form') }}">
        <!-- Personal Information -->
        <div class="form-row">
            <input type="text" name="name" placeholder="Your name" required>
        </div>
        <div class="form-row">
            <input type="number" name="height" placeholder="Height (cm)" required>
            <input type="number" name="weight" placeholder="Weight (kg)" required>
        </div>

        <!-- Divider -->
        <hr class="form-divider">

        <!-- Menstrual Cycle Information -->
        <div class="form-row">
            <div class="form-group">
                <label for="start_date">Start date of last month's period</label>
                <input type="date" id="start_date" name="start_date" required>
            </div>
            <div class="form-group">
                <label for="end_date">End date of last month's period</label>
                <input type="date" id="end_date" name="end_date" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="duration">Average menstrual cycle duration (days)</label>
                <input type="number" id="duration" name="duration" placeholder="e.g., 28" required>
            </div>
        </div>

        <!-- Button Section -->
        <div class="button-section">
            <a href="{{ url_for('choose_menu') }}" class="back-button">← Back</a>
            <button type="submit" class="submit-button">Submit</button>
        </div>
    </form>
</div>
{% endblock %}
